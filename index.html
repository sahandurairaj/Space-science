<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Traveller</title>
<meta name="description" content="Pack a cargo ship, launch it, pilot it to any of the eight planets, then run an outpost there. Balance power, oxygen, water, food and radiation to keep your crew alive.">
<meta name="theme-color" content="#02050C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a mission-control console. Resource strip on top, the outpost view and crew jobs on the left, systems and log on the right, and a sticky "End day" bar at the bottom. */
:root{
  --void:#02050C; --panel:#08122A; --panel2:#0D1C3C; --line:#1B3262; --ink:#E6EEFB; --muted:#93A6C9;
  --cyan:#5FD0FF; --blue:#3D8BFF; --good:#4ADE9B; --warn:#FFC24B; --bad:#FF5D6C;
  --display:'Bungee',Impact,'Arial Black',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 10px}
.brand{font-family:var(--display);font-size:18px;letter-spacing:.02em;color:var(--cyan);background:none;border:0;cursor:pointer;padding:0;text-align:left}
.brand small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;min-height:44px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--blue)}
.btn:active{transform:translateY(1px)}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px}
.btn.primary{background:linear-gradient(180deg,#3D8BFF,#2462D6);border-color:#5FA0FF;color:#fff}
.btn.primary:hover{background:linear-gradient(180deg,#56A0FF,#2C6FE8)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,72px);line-height:1;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.4vw,32px);line-height:1.1}
h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.lead{color:var(--muted);max-width:62ch;font-size:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.t-Training{color:var(--good);border-color:#2a6b52}
.chip.t-Medium{color:var(--cyan);border-color:#245a7a}
.chip.t-Hard{color:var(--warn);border-color:#7a5a20}
.chip.t-Expert{color:var(--bad);border-color:#7a2a35}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}

/* Title */
.hero{display:grid;gap:18px;padding-block:20px}
.hero canvas{width:100%;height:180px;display:block}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.howgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.howgrid .panel b{display:block;margin-bottom:4px}

/* Worlds */
.worlds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:grid;gap:8px;align-content:start;transition:border-color .15s,transform .15s}
.wcard:hover{border-color:var(--cyan);transform:translateY(-2px)}
.wcard canvas{width:100%;height:120px;display:block}
.wcard .nm{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wcard .nm b{font-family:var(--display);font-weight:400;font-size:20px}
.wcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}
.wcard dt{color:var(--muted)} .wcard dd{margin:0;text-align:right;font-family:var(--mono)}
.stars{color:var(--warn);letter-spacing:2px;font-size:14px}

/* Cargo */
.cargo{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:12px;align-items:start}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item.dis{opacity:.45}
.item .t{font-weight:700}
.item .d{color:var(--muted);font-size:14px}
.item .m{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:20px;font-weight:700}
.step button:hover{border-color:var(--blue)}
.step span{min-width:24px;text-align:center;font-family:var(--mono);font-size:18px}
.sum{position:sticky;top:10px;display:grid;gap:10px}
.bar{height:10px;border-radius:99px;background:#0b1630;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .2s}
.chk{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14px}
.chk li{display:grid;grid-template-columns:18px 1fr;gap:6px}
.chk li::before{content:'';width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--good)}
.chk li.w::before{background:var(--warn)} .chk li.b::before{background:var(--bad)}
.grouphd{margin-top:8px}

/* Base */
.hud{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.tile .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.w{border-color:#7a5a20} .tile.w .v{color:var(--warn)}
.tile.b{border-color:#8a2a38;background:#1a0b14} .tile.b .v{color:var(--bad)}
.tile .bar{height:6px;margin-top:4px}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;margin-top:10px}
.colL,.colR{display:grid;gap:12px;align-content:start;min-width:0}
.scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.scene canvas{display:block;width:100%;height:300px}
.sceneTag{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:12px;background:rgba(2,5,12,.7);border:1px solid var(--line);padding:4px 8px;border-radius:8px}
.fxTags{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.fxTags span{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:8px;background:rgba(40,10,15,.8);border:1px solid #8a2a38;color:#ffc3c9}
.crew{display:grid;gap:8px;margin-top:8px}
.cm{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--panel2)}
.cm .who b{display:block}
.cm .who .mini{display:grid;gap:3px;margin-top:4px}
.cm .who .bar{height:6px}
.cm .who .lbl{font-size:11px;color:var(--muted);font-family:var(--mono)}
.jobs{display:flex;gap:6px;flex-wrap:wrap}
.jobs button{flex:1 1 70px;min-height:40px;border-radius:9px;border:1px solid var(--line);background:#0a1530;cursor:pointer;font-size:14px;font-weight:700;padding:4px 6px}
.jobs button[aria-pressed="true"]{background:#173a78;border-color:var(--cyan);color:#fff}
.jobs button .e{display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--warn);letter-spacing:.06em}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.mods{display:grid;gap:6px;margin-top:8px}
.mod{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel2)}
.mod .dot{width:10px;height:10px;border-radius:50%;background:var(--good)}
.mod.off .dot{background:#4a5a7a} .mod.brk .dot{background:var(--bad);box-shadow:0 0 8px var(--bad)} .mod.shed .dot{background:var(--warn)}
.mod .n{font-weight:700}
.mod .st{font-size:13px;color:var(--muted)}
.mod.brk .st{color:var(--bad)}
.tog{min-width:64px;min-height:36px;border-radius:9px;border:1px solid var(--line);background:#0a1530;cursor:pointer;font-weight:700;font-size:13px}
.tog[aria-pressed="true"]{background:#123a2c;border-color:#2a8a63;color:var(--good)}
.log{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;max-height:220px;overflow:auto;font-size:14px}
.log li{padding-left:10px;border-left:3px solid var(--line)}
.log li.bad{border-color:var(--bad);color:var(--ink)} .log li.good{border-color:var(--good)} .log li.warn{border-color:var(--warn)}
.log li b{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}
.endbar{position:sticky;bottom:0;z-index:5;margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:rgba(8,18,42,.96);border:1px solid var(--line);border-radius:14px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(6px)}
.fc{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;min-width:0;flex:1}
.fc .mono{font-size:13px}
.fc .lbl{color:var(--muted)}
.endbar .btn{min-width:170px}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(1,3,8,.78);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .22s ease-out}
.card.bad{border-color:#8a2a38} .card.good{border-color:#2a8a63}
.card .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card .choices{display:grid;gap:8px}
.card .choices .btn{text-align:left}
.card ul{margin:0;padding-left:20px;display:grid;gap:6px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.6}to{transform:none;opacity:1}}

/* Report */
.report{display:grid;gap:14px;margin-top:12px}
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.bigstars{font-size:40px;color:var(--warn);letter-spacing:6px;white-space:nowrap}
.bigstars .off{color:#26385e}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:8px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.badge small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fact{border-left:4px solid var(--cyan)}


/* Steps */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.steps:empty{display:none}
.steps span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:#173a78;border-color:var(--cyan);color:#fff}
.steps span.done{color:var(--good);border-color:#2a6b52}
/* Flight */
html.playing,html.playing body{overflow:hidden;height:100%;overscroll-behavior:none}
.gfull{position:fixed;inset:0;z-index:40;background:#01030a;display:grid;grid-template-rows:auto minmax(0,1fr)}
.ftop{display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px));background:rgba(2,5,12,.92);border-bottom:1px solid var(--line)}
.ftop .fl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ftop .fl b{font-family:var(--display);font-weight:400;color:var(--cyan);font-size:16px}
.ftop .fl span{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ftop .fs{display:flex;gap:6px 14px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted)}
.ftop .fs b{color:var(--ink);font-variant-numeric:tabular-nums}
.fstage{position:relative;min-height:0;overflow:hidden}
#flyview{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#minimap{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;width:120px;height:170px;border:1px solid var(--line);border-radius:10px;background:rgba(2,8,20,.72)}
.pads{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.pads .grp{display:flex;gap:10px;pointer-events:auto}
.pad{width:68px;height:68px;border-radius:18px;border:1px solid #2a4a85;background:rgba(13,28,60,.72);font-size:24px;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.pad:active{background:rgba(61,139,255,.6)}
@media (pointer:coarse){.pads{display:flex}}
.fcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;z-index:3}
.fsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:15px}
@media (max-height:500px){#minimap{width:84px;height:118px}.pad{width:56px;height:56px}.ftop{padding-block:4px}.ftop .fs{font-size:12px}}
/* Hangar */
.coinbal{font-family:var(--mono);font-size:18px;color:#FFD36A}
.upgrades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.up{display:grid;gap:10px;align-content:start}
.lvl{display:flex;gap:4px}.lvl i{width:22px;height:8px;border-radius:4px;background:#1a2a4a}.lvl i.on{background:var(--cyan)}
@media (max-width:800px){.upgrades{grid-template-columns:1fr}}


/* Simple mode */
.btn.big{min-height:52px;font-size:18px;padding:12px 22px}
.slots{margin:14px 0 8px;font-size:18px}.slots b{font-family:var(--mono);color:var(--cyan);font-size:22px}
.packgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pcard{display:grid;gap:4px;align-content:start;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--panel);cursor:pointer;transition:border-color .15s,background .15s}
.pcard canvas{width:100%;height:70px;display:block}
.pcard b{font-size:17px}.pcard span{font-size:14px;color:var(--muted)}.pcard em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.pcard.on{border-color:var(--cyan);background:#0f2650}.pcard.on em{color:var(--good)}
.pcard:hover:not([disabled]){border-color:var(--blue)}.pcard[disabled]{opacity:.4;cursor:not-allowed}
.cargo2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.go{display:grid;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap}
.base2{display:grid;gap:12px}
.dayline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.dayline .sci{font-size:18px}.dayline .sci b{font-family:var(--mono);color:var(--cyan);font-size:24px}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.meter .mk{display:flex;justify-content:space-between;gap:8px;font-size:16px}.meter .mk span{font-family:var(--mono);font-size:14px}
.meter .mv{font-family:var(--mono);font-size:22px;font-weight:600}
.bar.big{height:14px}.meter .bar i{background:var(--good)}.meter.w .bar i{background:var(--warn)}.meter.b .bar i{background:var(--bad)}.meter.b{border-color:#8a2a38}
.alerts{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:14px;padding:6px 12px;border-radius:99px;border:1px solid #2a6b52;color:var(--good);background:#0b2a22}
.pill.w{border-color:#7a5a20;color:var(--warn);background:#2a2008}.pill.b{border-color:#8a2a38;color:#ffb3bb;background:#2a0b12}
.ask{margin-top:4px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{display:grid;gap:4px;padding:16px;border-radius:16px;border:2px solid #2a4a85;background:linear-gradient(180deg,#123068,#0b1d44);cursor:pointer;text-align:center;min-height:84px}
.act b{font-family:var(--display);font-weight:400;font-size:22px;color:#fff}.act span{color:var(--muted);font-size:14px}
.act:hover:not([disabled]){border-color:var(--cyan)}.act[disabled]{opacity:.4;cursor:not-allowed}

.scene.walk canvas{height:340px;outline:none}
.scene.walk canvas:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
.wpads{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:10px;pointer-events:none}
.wpads .grp{display:flex;gap:6px;pointer-events:auto}.wpads .pad{width:52px;height:52px;font-size:20px}
.wpads .go2{pointer-events:auto;width:64px;height:64px;background:rgba(36,98,214,.85);border-color:#5FA0FF;font-size:26px}
@media (pointer:coarse){.wpads{display:flex}}
.touch .wpads,.touch .pads{display:flex}
.walkbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.walkbar p{margin:0;flex:1 1 320px;color:var(--muted)}.walkbar p b{color:var(--ink)}
.walkbar .btn{min-width:240px}
@media (max-width:560px){.scene.walk canvas{height:300px}.walkbar .btn{min-width:0;width:100%}}

.card.evbad{border-color:#8a2a38}.card.evgood{border-color:#2a8a63}
.deltas{display:flex;gap:8px 16px;flex-wrap:wrap;font-family:var(--mono);font-size:16px}
@media (max-width:1000px){.packgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cargo2{grid-template-columns:1fr}.meters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.acts{grid-template-columns:1fr}.act{min-height:64px;padding:12px}.meter .mv{font-size:18px}}

@media (max-width:1000px){
  .hud{grid-template-columns:repeat(5,minmax(0,1fr))}
  .cols{grid-template-columns:1fr}
  .worlds{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---------- events ---------- */
function rollEvent(S,act){
  const w=Wof(S);
  if(w.resupply&&w.resupply.includes(S.day-1))return {tone:'good',title:'Supply truck!',text:'A delivery arrived: +20 air, water and food.',run:()=>{for(const k of ['air','water','food'])S[k]=Math.min(100,S[k]+20)}};
  if(act==='explore'&&Math.random()<.3)return {tone:'good',title:'Discovery!',text:'The crew found something nobody has seen before. +10 science.',run:()=>{S.science+=10}};
  if(Math.random()>.45)return null;
  const pool=['break','break'];
  for(let i=0;i<Math.round(w.storm*10);i++)pool.push('storm');
  if(w.dust)pool.push('dust','dust');
  if(w.kind==='station'||w.id==='mercury')pool.push('meteor');
  if(w.habUse>=2&&w.id!=='mercury')pool.push('cold');
  if(w.id==='venus')pool.push('acid','acid');
  const key=pick(pool);
  const brk=(why)=>{const c=S.mods.filter(m=>m.type!=='hab'&&!m.broken);if(!c.length)return null;const m=pick(c);
    return {tone:'bad',title:why[0],text:`${why[1]} The ${MODS[m.type].name.toLowerCase()} is broken. Choose Fix to repair it.`,run:()=>{m.broken=true}}};
  switch(key){
    case 'storm':{const sh=works(S,'shelter');return {tone:sh?'good':'bad',title:'Radiation storm!',text:sh?'The Sun blasted out fast particles, but your shield protected the crew. −3 health.':'The Sun blasted out fast particles. With no shield, the crew took a big dose. −30 health.',run:()=>{S.stats.storms++;if(sh)S.stats.blocked++;S.health=Math.max(0,S.health-(sh?3:30))}}}
    case 'dust':return {tone:'bad',title:'Dust storm',text:'Dust is blocking the Sun. Solar panels make only a quarter of their power for 3 sols.',run:()=>{S.fx.storm=3}};
    case 'meteor':return {tone:'bad',title:'Space rock hit!',text:'A tiny rock, faster than a bullet, punched a hole in the habitat. 10 air leaked out before the crew patched it.',run:()=>{S.air=Math.max(0,S.air-10)}};
    case 'cold':return {tone:'bad',title:'Cold snap',text:'It\'s getting even colder. Heating the habitat needs 1 more power for 2 days.',run:()=>{S.fx.cold=2}};
    case 'acid':return brk(['Acid clouds','Sulfuric acid in the clouds ate through a pipe.']);
    default:return brk(['Breakdown','A part wore out.'])}
}

     <button class="btn" id="kit" type="button">Pack for me</button><button class="btn primary big" id="launch" type="button" ${pack.length?'':'disabled'}>Launch to ${w.name} ▶</button></aside></div></section>`;
  document.querySelectorAll('canvas[data-m]').forEach(cv=>{fitCanvas(cv);const c=cv.getContext('2d'),W=cv.width,H=cv.height,t=cv.dataset.m;
    if(t==='crate'){const s=H/60;c.fillStyle='#a9875a';c.fillRect(W/2-22*s,H*.3,44*s,30*s);c.strokeStyle='#6d5434';c.lineWidth=2*s;c.strokeRect(W/2-22*s,H*.3,44*s,30*s);c.beginPath();c.moveTo(W/2-22*s,H*.3);c.lineTo(W/2+22*s,H*.3+30*s);c.moveTo(W/2+22*s,H*.3);c.lineTo(W/2-22*s,H*.3+30*s);c.stroke();return}
    const fake={day:3,batt:1,battCap:1,shield:0};const keep=S;S=fake;drawModule(c,t,W/2,H*.85,H/52,{count:1,broken:false,on:true,dust:false,grow:6},0,w,false);S=keep});
  document.querySelectorAll('.pcard').forEach(b=>b.onclick=()=>{const t=b.dataset.t,i=pack.indexOf(t);if(i>=0)pack.splice(i,1);else if(pack.length<w.slots)pack.push(t);buzz('tap');store.set('st8-pack-'+w.id,pack);screenCargo()});
  $('#kit').onclick=()=>{CARGO.pack=[...KITS[w.id]];buzz('tap');screenCargo()};
  $('#launch').onclick=()=>{S=newGame(w.id,pack);buzz('good');enterLandscape();startFlight(false)};
}
function meter(k,label,v,dlt){const st=v<=15?'b':v<=35?'w':'';
  const arrow=dlt>0?`<span class="good">▲ ${dlt}</span>`:dlt<0?`<span class="bad">▼ ${-dlt}</span>`:'<span class="muted">steady</span>';
  return `<div class="meter ${st}"><b>${label}</b><div class="bar big"><i style="width:${v}%"></i></div><span class="mv">${Math.round(v)}%</span><span class="ma">${arrow}</span></div>`}
function screenBase(){
  const w=Wof(S);
  $('#screen').innerHTML=`<section class="scr base2">
   <div class="scene walk"><canvas id="scene" tabindex="0" aria-label="Your outpost on ${w.name}. Walk with W A S D or the arrow keys, press E to act."></canvas><div class="sceneTag" id="sceneTag"></div>
     <div class="wpads"><div class="grp"><button class="pad" data-bdir="left" type="button" aria-label="Walk left">◀</button><button class="pad" data-bdir="up" type="button" aria-label="Walk back">▲</button><button class="pad" data-bdir="down" type="button" aria-label="Walk forward">▼</button><button class="pad" data-bdir="right" type="button" aria-label="Walk right">▶</button></div><button class="pad go2" id="padDo" type="button" aria-label="Do it">✓</button></div></div>
   <aside class="side">
     <div class="dayline"><h2 id="dayH"></h2><div class="sci">Science <b id="sciN"></b> / ${SCI_GOAL}</div></div>
     <div class="meters" id="meters"></div>
     <div class="alerts" id="alerts"></div>
     <p class="hint2" id="nearTxt">${IS_TOUCH()?'Walk with the arrows, then tap <b>✓</b> at a spot.':'Walk with <b>W A S D</b>, then press <b>E</b> at a spot.'} <b>Habitat</b>: rest · <b>Broken</b>: fix · <b>${w.kind==='station'?'Probe':'Rocks'}</b>: explore</p>
     <button class="btn primary big" id="doBtn" type="button" disabled>Walk to a spot</button></aside></section>`;
  $('#doBtn').onclick=doAction;$('#padDo').onclick=doAction;
  AST.x=.1;AST.y=.3;AST.moved=false;for(const k in BK)BK[k]=false;
  setTimeout(()=>{try{$('#scene').focus({preventScroll:true})}catch(e){}},50);
  refresh();startScene();
}
function refresh(){
  if(screen!=='base')return;const w=Wof(S),f=forecast();
  $('#meters').innerHTML=meter('air','Air',S.air,f.d.air)+meter('water','Water',S.water,f.d.water)+meter('food','Food',S.food,f.d.food)+meter('health','Health',S.health,f.d.health);
  const al=[];const p=f.p;
  al.push(p.off.length||!p.habOk?`<span class="pill w">Power too low: ${p.off.length?p.off.map(t=>MODS[t].name.toLowerCase()).join(', ')+' off':'habitat is cold'}</span>`:'<span class="pill">Power OK</span>');
  S.mods.filter(m=>m.broken).forEach(m=>al.push(`<span class="pill b">Broken: ${MODS[m.type].name}</span>`));
  if(S.fx.storm)al.push('<span class="pill w">Dust storm</span>');if(S.fx.cold)al.push('<span class="pill w">Cold snap</span>');
  $('#alerts').innerHTML=al.join('');
  $('#dayH').innerHTML=`${w.dayWord} ${S.day} <span class="muted">of ${DAYS}</span>`;$('#sciN').textContent=Math.round(S.science);lastZone='?';
  $('#sceneTag').textContent=w.cycle?(sunFactor(S)>0?'Daytime':'Night'):w.site;
}
function endDay(act){
  if(!S||S.over)return;const w=Wof(S);const rep=simulate(S,act);
  if(S.over){save();finish();return}
  flashT=performance.now();const ev=rollEvent(S,act);if(ev)ev.run();checkEnd(S,'health');save();refresh();
  const ch=(k,l)=>{const v=rep.d[k];return v?`<span class="${v>0?'good':'bad'}">${l} ${v>0?'+':'−'}${Math.abs(v)}</span>`:''};
  const md=$('#modal');
  md.innerHTML=`<div class="card ${ev?(ev.tone==='good'?'evgood':'evbad'):''}" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="eyebrow">${w.dayWord} ${rep.day} done</div>
   <div class="deltas">${['air','water','food','health','science'].map(k=>ch(k,k[0].toUpperCase()+k.slice(1))).join('')}</div>
   ${rep.notes.length?`<p style="margin:0" class="muted">${rep.notes.join(' ')}</p>`:''}
   ${ev?`<h2 id="dt" class="${ev.tone==='good'?'good':'bad'}">${ev.title}</h2><p style="margin:0">${ev.text}</p>`:`<h2 id="dt">A quiet ${w.dayWord.toLowerCase()}</h2>`}
   <button class="btn primary big" id="nextBtn" type="button">${S.over?'See the report':'Next '+w.dayWord.toLowerCase()+' ▶'}</button></div>`;
  md.hidden=false;$('#nextBtn').focus();buzz(ev?(ev.tone==='good'?'good':'bad'):'tap');
  $('#nextBtn').onclick=()=>{md.hidden=true;md.innerHTML='';if(S.over)finish();else{AST.x=SCN?SCN.posX.hab:.1;AST.y=.3;lastZone='?';try{$('#scene').focus({preventScroll:true})}catch(e){}}}}
function finish(){const w=Wof(S);const r=S.result;
  const stars=r.win?1+(S.science>=SCI_GOAL?1:0)+(S.health>=60?1:0):0;
  r.stars=stars;const b=best();if(b[w.id]==null||stars>b[w.id]){b[w.id]=stars;store.set('st8-best',b)}
  save();buzz(r.win?'win':'fail');go('report')}
function screenReport(){
  const w=Wof(S),r=S.result,fl=S.flight||{coins:0,sparks:0,hits:0,blocked:0,kits:0};
  const CAUSE={air:['The air ran out.','Pack an air maker, and make sure there is enough power to run it.'],
    water:['The water ran out.','Pack a water maker. The greenhouse uses water too.'],
    food:['The food ran out.','Pack a greenhouse. It starts making food on day 3.'],
    cold:['The habitat got too cold.','There wasn\'t enough power to heat it. Far from the Sun, pack nuclear power.'],
    health:['The crew became too unwell to go on.','Rest when health gets low, and pack the shield where there are storms.'],
    lost:['Your ship drifted off the space path for 10 seconds and was lost.','Stay on the glowing path. The minimap shows the curves ahead.']};
  const tips=[];if(!r.win)tips.push(CAUSE[r.cause]?.[1]||CAUSE.health[1]);
  if(r.cause!=='lost'&&S.science<SCI_GOAL)tips.push(`Explore more: you got ${S.science} of ${SCI_GOAL} science.`);
  if(r.win&&S.health<60)tips.push('Rest more often to keep the crew healthy.');
  if(fl.hits>=3)tips.push('Dodge space rocks in flight: they damage your cargo.');
  if(r.win&&!tips.length)tips.push('Perfect! Try a harder planet next.');
  const badges=[];if(r.win&&S.stats.storms)badges.push('Storm survivor');if(fl.hits===0&&r.cause!=='lost')badges.push('Ace pilot');if(S.science>=SCI_GOAL*1.5)badges.push('Science star');if(r.win&&S.health>=90)badges.push('Healthy crew');
  const pay=(r.stars||0)*20+badges.length*10;if(!r.paid){r.paid=true;if(pay)addCoins(pay);save()}
  $('#screen').innerHTML=`<section class="scr report">
   <div class="verdict panel" style="border-left:4px solid ${r.win?'var(--good)':'var(--bad)'}"><div><div class="muted mono" style="font-size:13px">${w.name.toUpperCase()}</div><h2>${r.win?'Mission complete!':'Mission failed'}</h2><p class="lead" style="margin:6px 0 0">${r.win?`Your crew lived ${DAYS} ${w.dayWord.toLowerCase()}s on ${w.name}.`:(CAUSE[r.cause]||CAUSE.health)[0]}</p></div>
    <div class="bigstars" aria-label="${r.stars} of 3 stars">${'★'.repeat(r.stars)}<span class="off">${'★'.repeat(3-r.stars)}</span></div></div>
   <div class="rgrid"><div class="panel"><h3>Next time</h3><ul style="margin:8px 0 0;padding-left:20px;display:grid;gap:6px">${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>
   <div class="panel fact"><h3>Real NASA science</h3><p style="margin:8px 0 0">${w.fact}</p></div>
   <div class="panel"><div class="coinbal">${coinIcon} +${fl.coins+pay} SpaceCoins</div>${badges.length?`<div class="badges" style="margin-top:8px">${badges.map(b=>`<div class="badge">${b}</div>`).join('')}</div>`:''}</div></div>
   <div class="tbtns"><button class="btn primary big" id="again" type="button">Try ${w.name} again</button><button class="btn big" id="other" type="button">Another planet</button><button class="btn big" id="hang" type="button">Hangar</button></div>
  </section>`;
  $('#again').onclick=()=>{CARGO={world:w.id,pack:[...S.pack]};store.del('st8-save');go('cargo')};
  $('#other').onclick=()=>{store.del('st8-save');go('worlds')};
  $('#hang').onclick=()=>{HANGAR_BACK='report';go('hangar')};
}
function showHelp(){
  const md=$('#modal');
  md.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="ht"><h2 id="ht">How to play</h2><ul>
   <li><b>Pack</b> 4 or 5 modules. Power runs everything. The crew needs air, water and food.</li>
   <li><b>Fly:</b> ← → steer, ↑ faster, ↓ slower. Grab coins and blue sparks. Dodge rocks. Don't leave the path for 10 seconds!</li>
   <li><b>Each day</b> walk your astronaut with W A S D (or the arrows). Go to the habitat to rest, a broken module to fix it, or the explore spot for science. Press E.</li>
   <li><b>Win</b> by keeping your crew alive for 10 days.</li></ul>
   <button class="btn primary" id="hOk" type="button">Got it</button></div>`;
  md.hidden=false;$('#hOk').focus();$('#hOk').onclick=()=>{md.hidden=true;md.innerHTML=''}}

/* ---------- boot ---------- */
$('#home').onclick=()=>go('title');
$('#helpBtn').onclick=showHelp;
const hb=$('#hapBtn');const setH=()=>hb.textContent=`Vibration: ${HAPT?'on':'off'}`;setH();
hb.onclick=()=>{HAPT=!HAPT;store.set('st8-hapt',HAPT);setH();buzz('tap')};
window.EWO={WORLDS,KITS,newGame,simulate,rollEvent,checkEnd,powerPlan,get S(){return S},set S(v){S=v},go,refresh,startFlight,get F(){return F},PILOT,KEYS,setTS:v=>{TIME_SCALE=v},WALLET,endDay};
go('title');
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
